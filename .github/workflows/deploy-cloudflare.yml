name: Test & Deploy Nong ChokChuay to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full commit SHA approved for production deployment
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node worker and frontend auth tests
        run: |
          node --check worker.js
          node --check static/app.js
          node --test tests/test_worker_js.mjs tests/test_frontend_auth.mjs

  deploy-cloudflare:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm approved revision
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          if [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The approved SHA does not match this workflow run."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker & Container to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is required to deploy."
            exit 1
          fi
          npx wrangler deploy
